set promod_economy "1"
set promod_standard_red_dots "0"
set promod_mode "custom_public_lan"
set sv_punkbuster "0"
set cl_punkbuster "0"
set g_gametype "sd"
set sv_hostname "Promod Loadout + Economy"
set logfile "2"
set g_log "games_mp.log"
set g_logSync "1"
set ui_flat_loadout "1"
set ui_flat_rules "1"
set ui_lab_hud "0"
bind F6 "openscriptmenu loadout open"
bind F7 "openscriptmenu ui_lab open"

